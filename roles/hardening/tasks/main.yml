---
# Firewall
- name: Install base hardening packages
  ansible.builtin.dnf:
    name: "{{ hardening_base_packages }}"
    state: present
  tags:
    - firewall
    - packages

- name: Ensure firewalld is running and enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags:
    - firewall

- name: Allow required services through firewalld
  ansible.posix.firewalld:
    zone: "{{ hardening_firewall_zone }}"
    service: "{{ firewall_service }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ hardening_firewall_services_allowed }}"
  loop_control:
    loop_var: firewall_service
    label: "{{ firewall_service }}"
  notify: Reload firewalld
  tags:
    - firewall

- name: Remove blocked services from firewalld
  ansible.posix.firewalld:
    zone: "{{ hardening_firewall_zone }}"
    service: "{{ firewall_service }}"
    permanent: true
    immediate: true
    state: disabled
  loop: "{{ hardening_firewall_services_blocked }}"
  loop_control:
    loop_var: firewall_service
    label: "{{ firewall_service }}"
  notify: Reload firewalld
  tags:
    - firewall

# SELinux
- name: Set SELinux mode
  ansible.posix.selinux:
    policy: "{{ hardening_selinux_policy }}"
    state: "{{ hardening_selinux_state }}"
  register: selinux_result
  tags:
    - selinux

- name: Reboot if SELinux mode change requires it
  ansible.builtin.reboot:
    msg: "Rebooting to apply SELinux mode change"
    reboot_timeout: 300
  when: selinux_result.reboot_required | default(false)
  tags:
    - selinux

- name: Set SELinux booleans
  ansible.posix.seboolean:
    name: "{{ selinux_boolean.name }}"
    state: "{{ selinux_boolean.state }}"
    persistent: true
  loop: "{{ hardening_selinux_booleans }}"
  loop_control:
    loop_var: selinux_boolean
    label: "{{ selinux_boolean.name }}"
  tags:
    - selinux
